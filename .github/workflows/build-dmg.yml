name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
          - rid: osx-x64
            arch: x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish self-contained app
        run: >-
          dotnet publish TiengCuoiSoviaMac.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o "$RUNNER_TEMP/publish"

      - name: Create app bundle and icon
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Tieng Cuoi Sovia.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "$RUNNER_TEMP/publish/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/TiengCuoiSovia"

          ICONSET="$RUNNER_TEMP/Sovia.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" Assets/Sovia.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" Assets/Sovia.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/Sovia.icns"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Tiếng Cười Sovia</string>
            <key>CFBundleDisplayName</key><string>Tiếng Cười Sovia</string>
            <key>CFBundleIdentifier</key><string>vn.sovia.tiengcuoi</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleExecutable</key><string>TiengCuoiSovia</string>
            <key>CFBundleIconFile</key><string>Sovia</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          codesign --force --deep --sign - "$APP"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$APP" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Tiếng Cười Sovia" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "TiengCuoiSovia-macOS-${{ matrix.arch }}.dmg"

      - name: Test mounted DMG, app launch, and all audio files
        run: bash scripts/test-macos-bundle.sh "TiengCuoiSovia-macOS-${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: TiengCuoiSovia-macOS-${{ matrix.arch }}
          path: TiengCuoiSovia-macOS-${{ matrix.arch }}.dmg
          compression-level: 0

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: TiengCuoiSovia-macOS-*
          merge-multiple: true
      - name: Create release and upload both DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" ./*.dmg --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" ./*.dmg --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
